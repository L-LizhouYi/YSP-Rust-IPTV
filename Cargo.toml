[workspace]
resolver = "2"
members = ["crates/ysp-core", "crates/ysp-net", "crates/ysp-server"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
axum = "0.7"
bytes = "1"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
lru = "0.12"
md5 = "0.7"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
url = "2"

# 2G 内存的小机器上编译：不开 LTO，限制并行度由构建命令控制。
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
debug = false
incremental = false
